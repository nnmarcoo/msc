[package]
name = "verse-core"
description = "Audio playback and music library management for Verse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
explore = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

[dependencies]
kira = { version = "0.12.2", features = ["aac", "alac", "isomp4"] }
lofty = "0.22.4"
rayon = "1.11.0"
rand = "0.9.2"
directories = "6.0.0"
rustfft = "6.4.1"
triple_buffer = "8.1.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
thiserror = "2.0.17"
walkdir = "2.5.0"

reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "http2",
], optional = true }
serde_json = { version = "1.0.151", optional = true }
tokio = { version = "1.53.1", default-features = false, features = [
    "process",
    "io-util",
    "time",
    "fs",
    "sync",
], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "time"] }
kira = { version = "0.12.3", features = ["aac", "alac", "isomp4"] }

[[example]]
name = "explore_probe"
required-features = ["explore"]

[[example]]
name = "download_probe"
required-features = ["explore"]

[[example]]
name = "resolve_probe"
required-features = ["explore"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
 