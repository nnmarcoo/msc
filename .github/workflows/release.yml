name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      ARTIFACT: verse-${{ matrix.platform }}.${{ matrix.ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            platform: linux-x86_64
            ext: tar.gz
          - os: windows
            runner: windows-latest
            platform: windows-x86_64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build
        run: cargo build --release -p verse-gui

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          cp target/release/verse dist/
          tar -czf "$ARTIFACT" -C dist .

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: Compress-Archive -Path target\release\verse.exe -DestinationPath $env:ARTIFACT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            verse-*.tar.gz
            verse-*.zip
